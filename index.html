<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description"
    content="Steel Balls - Mobile-first PWA workout tracker with offline analytics & PR tracking" />

  <!-- PWA Manifest & iOS Icons -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <title>Steel Balls - Workout Tracker</title>
  <script>
    // Clear lingering service workers in local development so stale PWA cache never blanks the page
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
    }
  </script>
</head>

<body class="bg-slate-950 text-slate-100 font-['Outfit',sans-serif] antialiased min-h-screen select-none">
  <div id="root">
    <div id="fallback-loader"
      style="min-height: 100vh; background: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #94a3b8; font-family: 'Outfit', sans-serif;">
      <div
        style="width: 40px; height: 40px; border: 3px solid #1e293b; border-top-color: #06b6d4; border-radius: 50%; animation: sb-spin 0.8s linear infinite;">
      </div>
      <div style="font-size: 14px; font-weight: 700; color: #e2e8f0; letter-spacing: -0.01em;">Loading Steel Balls...
      </div>
      <button id="fallback-reload-btn"
        onclick="if('caches' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c)})})};if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})})};localStorage.clear();sessionStorage.clear();window.location.reload(true);"
        style="display: none; margin-top: 10px; padding: 8px 18px; background: #06b6d4; color: #020617; font-weight: 800; font-size: 12px; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(6,182,212,0.3);">
        Reset Cache & Reload
      </button>
    </div>
    <style>
      @keyframes sb-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      setTimeout(function () {
        var btn = document.getElementById('fallback-reload-btn');
        if (btn) btn.style.display = 'inline-block';
      }, 3000);
    </script>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
