<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Steel Gradients -->
    <radialGradient id="steelLeft" cx="38%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#718096" />
      <stop offset="88%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <radialGradient id="steelRight" cx="38%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#718096" />
      <stop offset="88%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <!-- Ground Shadow -->
    <ellipse id="shadow" cx="256" cy="425" rx="180" ry="24" fill="#0f172a" opacity="0.4" />
  </defs>

  <!-- Background Ground Shadow -->
  <use href="#shadow" />

  <!-- Left Steel Ball -->
  <g id="leftBall">
    <!-- Main Sphere -->
    <circle cx="175" cy="256" r="115" fill="url(#steelLeft)" stroke="#1e293b" stroke-width="6" />
    <!-- Outer Rim Highlight -->
    <circle cx="175" cy="256" r="113" fill="none" stroke="#475569" stroke-width="3" opacity="0.6" />
    <!-- Specular Highlight Arc -->
    <ellipse cx="145" cy="210" rx="30" ry="20" fill="#ffffff" opacity="0.85" transform="rotate(-25 145 210)" />
    <circle cx="140" cy="205" r="12" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Right Steel Ball -->
  <g id="rightBall">
    <!-- Main Sphere -->
    <circle cx="337" cy="256" r="115" fill="url(#steelRight)" stroke="#1e293b" stroke-width="6" />
    <!-- Outer Rim Highlight -->
    <circle cx="337" cy="256" r="113" fill="none" stroke="#475569" stroke-width="3" opacity="0.6" />
    <!-- Specular Highlight Arc -->
    <ellipse cx="307" cy="210" rx="30" ry="20" fill="#ffffff" opacity="0.85" transform="rotate(-25 307 210)" />
    <circle cx="302" cy="205" r="12" fill="#ffffff" opacity="0.9" />
  </g>
</svg>